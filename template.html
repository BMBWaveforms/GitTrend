<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitTrend · 开源趋势观察台</title>
<style>
:root{
  color-scheme:light;
  --ink:#fcfcfc;--panel:#ffffff;--panel2:#f3f4f5;--rule:#e9eaec;
  --text:#202124;--dim:#50565e;--faint:#60666f;--accent-text:#a84408;--control:#878c94;
  --mint:#e66b16;--copper:#e66b16;--blue:#8260d3;--positive:#1e714d;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:var(--sans);--rail:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#eceeef;color:var(--text);font:1rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-text);outline-offset:4px}
::selection{background:#ffdfc7;color:#202124}
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 32px);margin:16px;border:1px solid #e2e4e7;border-radius:18px;background:var(--ink);box-shadow:0 2px 4px #00000006}
.rail{background:#fff;border-right:1px solid var(--rule);padding:26px 14px 20px;display:flex;flex-direction:column;gap:30px;position:sticky;top:16px;height:calc(100vh - 32px);min-width:0;border-radius:18px 0 0 18px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}
.brand-mark{width:32px;height:32px;color:var(--accent-text);flex:none}
.brand b{font-size:1.375rem;letter-spacing:-1px;font-weight:650;line-height:1.2;display:block}
.brand small{display:block;font-size:0.8125rem;letter-spacing:.05em;color:var(--faint);margin-top:5px}
nav{display:flex;flex-direction:column;gap:5px}
nav button{position:relative;display:flex;align-items:center;gap:11px;min-height:42px;padding:9px 12px;border-radius:7px;color:var(--dim);text-align:left;font-size:0.875rem}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:#f5f5f6;color:var(--text)}
nav button.on:before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:3px;background:var(--mint);border-radius:0 2px 2px 0}
.nav-icon{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button .n{margin-left:auto;font:0.8125rem var(--mono);color:var(--faint)}
nav button.on .n{color:var(--accent-text)}
.filters{display:flex;flex-direction:column;gap:24px;overflow-y:auto;flex:1;min-height:0;padding:0 10px 10px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.fgroup>h3{font-size:0.8125rem;color:var(--faint);margin-bottom:10px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.reset{font-size:0.8125rem;color:var(--accent-text);padding:2px 0 2px 8px}
.reset:hover{text-decoration:underline}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:5px;font-size:0.8125rem;color:var(--dim);text-align:left;min-height:32px}
.chip:hover{background:var(--panel2);color:var(--text)}
.chip.on{background:#fff0e5;color:#a84408}
.chip-label{display:flex;align-items:center;gap:8px;min-width:0}
.chip-dot{width:5px;height:5px;border-radius:50%;flex:none}
.chip-count{font:0.8125rem var(--mono);color:var(--faint)}
select{width:100%;background:var(--panel);border:1px solid var(--rule);padding:9px 28px 9px 10px;border-radius:6px;font-size:0.8125rem;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 11px) 16px;background-size:4px 4px;background-repeat:no-repeat}
.rail footer{font-size:0.8125rem;color:var(--faint);line-height:1.9;border-top:1px solid var(--rule);padding:16px 10px 0}
.rail footer b{color:var(--dim);font-weight:500}
.source-dot{display:inline-block;width:5px;height:5px;background:var(--mint);border-radius:50%;margin-right:6px}
main{min-width:0;padding:0 26px 48px;max-width:1680px;width:100%;margin:auto}
.topbar{position:sticky;top:16px;z-index:30;background:rgba(252,252,252,.96);backdrop-filter:blur(14px);display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--rule);min-height:76px}
.dateline{font-size:0.8125rem;color:var(--faint);display:flex;align-items:center;gap:12px;white-space:nowrap}
.dateline b{font-weight:500;color:var(--dim)}
.live{font-size:0.8125rem;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;padding:6px 9px;background:var(--panel);border:1px solid var(--rule);border-radius:5px}
.live i{width:5px;height:5px;border-radius:50%;background:var(--mint);flex:none}
.live.off i{background:var(--faint)}
.search{margin-left:auto;position:relative;width:280px;min-width:120px}
.search input{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:10px 32px;color:var(--text);font-size:0.8125rem;outline:none}
.search input:focus{border-color:var(--accent-text);box-shadow:0 0 0 3px #e66b1612}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:13px;stroke:var(--faint)}
.search kbd{position:absolute;right:10px;top:10px;font:0.8125rem var(--mono);color:var(--faint);border:1px solid var(--rule);border-radius:3px;padding:2px 5px}
.view{display:none}.view.on{display:block}
.hero{padding:28px 0 24px;display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:center;gap:32px}
.hero h1{font-size:clamp(1.75rem,2.4vw,2rem);font-weight:600;line-height:1.3;letter-spacing:-.8px}
.hero p{color:var(--dim);max-width:62ch;font-size:0.8125rem;margin-top:9px;line-height:1.9}
.hero .stamp{border-left:1px solid var(--rule);padding-left:26px;font-size:0.8125rem;color:var(--faint);line-height:1.9}
.stamp-label{display:block;font-size:0.8125rem;margin-bottom:3px}
.hero .stamp b{font-size:1.9375rem;letter-spacing:-1px;color:var(--text);display:block;font-weight:500;line-height:1.3;font-variant-numeric:tabular-nums}
.hero .stamp b small{font-size:0.8125rem;color:var(--faint);margin-left:7px;letter-spacing:0;font-weight:400}
.coverage{display:flex;height:4px;overflow:hidden;background:var(--panel2);border-radius:2px;margin:11px 0 7px}
.coverage i{display:block;background:var(--mint);height:100%}
.coverage-label{display:flex;justify-content:space-between;gap:6px;font-size:0.8125rem}
.coverage-label span:first-child{color:var(--accent-text)}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 13px}
.section-heading h2,.pane h2{font-size:0.875rem;font-weight:550}
.section-heading p,.pane h2 span{font-size:0.8125rem;color:var(--faint);font-weight:400}
.movers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mover{padding:17px 16px 20px;border:1px solid var(--rule);border-radius:9px;background:var(--panel);position:relative;text-align:left;min-width:0;overflow:hidden;transition:border-color .16s,background .16s}
.mover:first-child{background:#fff9f4;border-color:#f4d1b8}
.mover:hover{background:var(--panel2);border-color:#e4ac84}
.mover .rk{display:flex;justify-content:space-between;align-items:center;font-size:0.8125rem;color:var(--faint);margin-bottom:17px;gap:6px}
.mover .rk em{font-style:normal;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mover .mom{font-size:2.1875rem;line-height:1.1;letter-spacing:-1.5px;font-weight:500;font-variant-numeric:tabular-nums}
.mover:first-child .mom{color:#c6580c}
.mover .mom i{font-style:normal;font-size:0.8125rem;color:var(--faint);margin-left:5px;letter-spacing:0;font-weight:400}
.mover .nm{display:block;margin-top:12px;font-size:0.875rem;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mover .owner{display:block;font-size:0.8125rem;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:2px}
.mover .dt{display:block;margin-top:15px;font-size:0.8125rem;color:var(--positive);font-variant-numeric:tabular-nums}
.bar{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--rule)}
.bar i{display:block;height:100%;background:var(--mint)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:24px;margin-top:28px}
.pane{min-width:0;padding:22px 24px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
.pane h2{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.domain-row{display:grid;grid-template-columns:100px minmax(0,1fr) 28px;align-items:center;gap:14px;padding:6px 0;font-size:0.8125rem}
.domain-row .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.domain-row .tr{height:5px;background:var(--panel2);border-radius:2px;overflow:hidden}
.domain-row .tr i{display:block;height:100%;border-radius:2px;opacity:.8}
.domain-row .ct{font:0.8125rem var(--mono);color:var(--faint);text-align:right}
.notes{display:flex;flex-direction:column;gap:15px}
.note{display:grid;grid-template-columns:5px minmax(0,1fr);gap:12px;font-size:0.8125rem;line-height:1.8}
.note .k{background:var(--faint);border-radius:50%;height:5px;margin-top:7px}
.note.hot .k{background:var(--copper)}.note.cool .k{background:var(--blue)}.note.mint .k{background:var(--mint)}
.note b{display:block;color:var(--text);font-weight:500;margin-bottom:3px;overflow-wrap:anywhere}
.note span{color:var(--dim)}
.tbl-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:30px 0 16px}
.tbl-head h2{font-size:1.125rem;font-weight:550;letter-spacing:-.3px}
.tbl-head p{font-size:0.8125rem;color:var(--faint)}
/* The header and rows share tracks at every breakpoint. Keep the new-project grid separate. */
.cols,.row{display:grid;grid-template-columns:26px minmax(160px,1fr) 76px 60px 70px 76px 52px 64px;gap:10px;align-items:center}
.cols.cols-new,.row.row-new{grid-template-columns:30px minmax(180px,1fr) 80px 84px 100px 90px}
.cols{padding:11px 12px 11px 0;background:var(--panel);border-block:1px solid var(--rule);font-size:0.8125rem;color:var(--faint);border-radius:6px 6px 0 0}
.cols span{user-select:none;white-space:nowrap}.cols [data-s]{cursor:pointer}
.cols span:nth-child(n+3){text-align:right}
.cols [data-s]:hover{color:var(--text)}.cols .ar{color:var(--accent-text)}
.rows{display:flex;flex-direction:column}
.row{padding:15px 12px 15px 0;border-bottom:1px solid var(--rule);cursor:pointer;text-align:left;width:100%;min-width:0}
.row:hover{background:var(--panel)}
.row:focus-visible{outline-offset:-2px}
.row .rk{font:0.8125rem var(--mono);color:var(--faint);text-align:right}
.row .main{min-width:0}
.row .repo{font-size:0.8125rem;font-weight:550;display:flex;align-items:center;min-width:0}
.row .repo .own{color:var(--faint);font-weight:400;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .repo .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.row .repo .dot{width:5px;height:5px;border-radius:50%;flex:none;margin-right:8px}
.row .desc{font-size:0.8125rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.num{font:0.8125rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.num.big{font-size:0.875rem;color:var(--text)}.num.up{color:var(--positive)}.num.dim{color:var(--dim)}.num.warn{color:var(--copper)}
.mom-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mom-cell .v{font-size:0.875rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.mom-cell .track{width:32px;height:3px;background:var(--panel2);border-radius:2px;flex:none}
.mom-cell .track i{display:block;height:100%;background:var(--mint);border-radius:2px;opacity:.75}
.lang{font-size:0.8125rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:64px;height:18px;display:block;margin-left:auto}.spark path{fill:none;stroke:var(--mint);stroke-width:1.4;stroke-linecap:round}.spark path.flat{stroke:var(--faint);stroke-dasharray:2 4;opacity:.5}
.empty{padding:60px 16px;text-align:center;color:var(--faint);font-size:0.8125rem}
.hn-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--copper);margin-left:7px;flex:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:4px}
.dcard{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px;min-width:0}
.dcard h3{font-size:0.875rem;font-weight:550;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.dcard h3 em{font-style:normal;font-size:0.8125rem;color:var(--faint)}
.dcard ol{list-style:none;display:flex;flex-direction:column;gap:10px}
.dcard li{display:flex;justify-content:space-between;gap:10px;font-size:0.8125rem;cursor:pointer;padding:3px 0}
.dcard li:hover span{color:var(--accent-text)}
.dcard li span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dcard li b{font:0.8125rem var(--mono);color:var(--faint);flex:none}
.scrim{position:fixed;inset:0;background:#2021244d;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:60;backdrop-filter:blur(3px)}.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--rule);transform:translateX(100%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility .25s;z-index:70;overflow-y:auto;padding:40px 32px 50px;box-shadow:-12px 0 60px #00000014}
.drawer.on{transform:none;visibility:visible}
body.drawer-open{overflow:hidden}
.drawer .x{position:absolute;top:18px;right:18px;color:var(--dim);font-size:1.0625rem;width:32px;height:32px;border:1px solid var(--rule);border-radius:6px;line-height:1}
.drawer .x:hover{color:var(--text);background:var(--panel2)}
.drawer .tag{font-size:0.8125rem;color:var(--accent-text);padding-right:32px}
.drawer h2{font-size:1.625rem;font-weight:550;margin:14px 0 6px;line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.5px}
.drawer .sub{font-size:0.8125rem;color:var(--faint)}
.drawer .body{color:var(--dim);font-size:0.875rem;line-height:1.9;margin:20px 0 26px;overflow-wrap:anywhere}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--ink);border:1px solid var(--rule);border-radius:8px;margin-bottom:28px;overflow:hidden}
.dstat{padding:16px 12px;border-right:1px solid var(--rule)}.dstat:nth-child(3n){border-right:none}.dstat:nth-child(n+4){border-top:1px solid var(--rule)}
.dstat .k{font-size:0.8125rem;color:var(--faint);display:block;margin-bottom:7px}.dstat .v{font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums}.dstat .v small{font-size:0.8125rem;color:var(--faint);margin-left:3px}.dstat .v small.na{font-size:0.8125rem;margin:0}
.dsec{margin-bottom:26px}.dsec h4{font-size:0.8125rem;color:var(--dim);font-weight:500;margin-bottom:12px}
.hncard{border:1px solid var(--rule);background:var(--ink);border-radius:7px;padding:14px;font-size:0.8125rem;line-height:1.7;display:block}.hncard:hover{border-color:var(--faint)}.hncard b{display:block;font-weight:500;margin-bottom:5px;overflow-wrap:anywhere}.hncard span{font-size:0.8125rem;color:var(--faint)}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{border:1px solid var(--rule);border-radius:6px;padding:9px 12px;font-size:0.8125rem;color:var(--dim)}.links a:first-child{background:var(--mint);border-color:var(--accent-text);color:#fff;font-weight:600}.links a:hover{border-color:var(--accent-text);color:var(--accent-text)}.links a:first-child:hover{background:#cd590c;color:#fff}
.tbl-mini{width:100%;font-size:0.8125rem;border-collapse:collapse}.tbl-mini td{padding:9px 0;border-bottom:1px solid var(--rule)}.tbl-mini td:last-child{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
@media(min-width:1600px){main{padding-inline:48px}.movers{gap:14px}.mover{padding:22px}}
@media(max-width:1240px){
  :root{--rail:236px}main{padding-inline:26px}.topbar{gap:12px}.dateline span:last-child{display:none}.search{width:240px}
  .cols:not(.cols-new),.row:not(.row-new){grid-template-columns:26px minmax(140px,1fr) 74px 62px 68px 70px}
  .cols:not(.cols-new)>*:nth-child(7),.cols:not(.cols-new)>*:nth-child(8),.row:not(.row-new)>*:nth-child(7),.row:not(.row-new)>*:nth-child(8){display:none}
  .cols.cols-new,.row.row-new{grid-template-columns:26px minmax(140px,1fr) 66px 70px 86px 70px}
  .hero{grid-template-columns:minmax(0,1fr) 225px;gap:22px}.hero .stamp{padding-left:22px}.hero h1{font-size:1.875rem}
  .movers{grid-template-columns:repeat(5,minmax(160px,1fr));overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;scroll-snap-type:x proximity}.mover{scroll-snap-align:start}
  .split{gap:16px}.pane{padding:20px}.domain-row{grid-template-columns:82px minmax(0,1fr) 24px;gap:10px}
}
@media(max-width:1000px) and (min-width:821px){.split{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.hero .stamp{border-left:none;padding:16px 0 0;border-top:1px solid var(--rule);max-width:320px}.dateline b{display:none}.cols:not(.cols-new),.row:not(.row-new){grid-template-columns:24px minmax(120px,1fr) 64px 54px 60px 60px;gap:9px}.cols.cols-new,.row.row-new{grid-template-columns:24px minmax(120px,1fr) 60px 62px 74px 60px;gap:9px}.mom-cell .track{display:none}}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:18px 18px 12px;gap:16px;border-radius:0}.brand{padding:0;gap:9px}.brand-mark{width:27px;height:27px}.brand b{font-size:1.25rem}.brand small{font-size:0.8125rem;margin-top:2px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}nav button{white-space:nowrap;min-height:38px;padding:8px 10px;font-size:0.8125rem;gap:7px}nav button.on:before,nav button .n{display:none}.nav-icon{width:15px;height:15px}
  .filters{gap:14px;overflow:visible;flex:none;padding:0}.chips{flex-direction:row;overflow-x:auto;gap:6px;padding:0 0 4px;scrollbar-width:none}.chip{flex:none;border:1px solid var(--rule);padding:5px 10px;min-height:32px;border-radius:6px;font-size:0.8125rem}.chip.on{border-color:#f2bd96}.chip-count{font-size:0.8125rem}.chip-dot{display:none}
  .fgroup>h3{display:none}.fgroup:nth-child(2),.fgroup:nth-child(3){display:none}.rail footer{display:none}

          <option value="45">45 分以上</option>
          <option value="60">60 分以上</option>
        </select>
      </div>
    </div>
    <footer id="foot"></footer>
  </aside>

  <main>
    <div class="topbar">
      <div class="dateline" id="dateline"></div>
      <button class="live" id="live" type="button" aria-label="立即检查数据更新"></button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
        </svg>
        <input id="q" type="search" aria-label="搜索项目" placeholder="搜索项目、语言或方向…" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </div>

    <section class="view on" id="view-overview"></section>
    <section class="view" id="view-velocity"></section>
    <section class="view" id="view-new"></section>
    <section class="view" id="view-domains"></section>
    <section class="view" id="view-all"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert></aside>

<script>
let DATA = /*__DATA__*/{};
let REPOS = DATA.repos || [];

const DOMAIN_COLORS = {
  "AI Agent":"#ee843b","LLM 应用":"#48b5d7","模型 / 训练":"#9163d7","AI 基建":"#53afa3",
  "开发工具":"#e7b62f","数据 / 数据库":"#ca9266","云原生 / 基础设施":"#788fc0",
  "前端 / Web":"#d87eab","移动 / 跨端":"#8ea950","安全":"#d46c68","效率 / 个人工具":"#a38ac6",
  "学习资源":"#a7a173","音视频 / 图形":"#b984b1","区块链 / Web3":"#b79854","其他":"#a7adb4"
};
const dc = d => DOMAIN_COLORS[d] || "#8b958f";
const DOMAIN_LABELS = {
  "AI Agent":"AI 助手","LLM 应用":"大模型应用","模型 / 训练":"模型训练","AI 基建":"AI 基础设施",
  "开发工具":"开发工具","数据 / 数据库":"数据库","云原生 / 基础设施":"云与服务器","前端 / Web":"网页开发",
  "移动 / 跨端":"手机 App","安全":"安全","效率 / 个人工具":"效率工具","学习资源":"学习资料",
  "音视频 / 图形":"音视频 / 图形","区块链 / Web3":"区块链 / Web3","其他":"其他"
};
const dl = d => DOMAIN_LABELS[d] || d;

const state = { view:"overview", domain:"全部", lang:"全部", minMom:0, q:"", sort:"momentum", dir:-1 };

/* ---------- helpers ---------- */
const fmt = n => n==null ? "—"
  : n>=1e9 ? (n/1e9).toFixed(1).replace(/\.0$/,"")+"b"
  : n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"")+"m"
  : n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"k"
  : String(Math.round(n));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"")) ? u : "#";

function spark(points){
  if(!points || points.length<2) return '<svg class="spark" role="img" aria-label="历史记录不足，暂无趋势"><title>历史记录不足，暂无趋势</title><path class="flat" d="M1 9 L63 9"/></svg>';
  const vals = points.map(p=>p[1]);
  const mn = Math.min(...vals), mx = Math.max(...vals), span = Math.max(mx-mn,1);
  const step = 62/(points.length-1);
  const d = vals.map((v,i)=>`${i?"L":"M"}${(1+i*step).toFixed(1)} ${(17-(v-mn)/span*15).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 64 18"><path d="${d}"/></svg>`;
}

function ageText(d){
  if(d==null) return "";
  if(d<1) return "今天";
  if(d<30) return d+" 天";
  if(d<365) return Math.round(d/30)+" 个月";
  return (d/365).toFixed(1)+" 年";
}

function filtered(){
  let rows = REPOS.filter(r=>{
    if(state.domain!=="全部" && r.domain!==state.domain) return false;
    if(state.lang!=="全部" && (r.language||"")!==state.lang) return false;
    if((r.momentum||0) < state.minMom) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      const hay=(r.repo+" "+(r.desc||"")+" "+(r.language||"")+" "+(r.domain||"")+" "+
        ((r.topics||[]).join(" "))).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const k = state.sort, dir = state.dir;
  rows.sort((a,b)=>{
    let av=a[k], bv=b[k];
    if(k==="rate_day"){ av=(a.metrics||{}).rate_day; bv=(b.metrics||{}).rate_day; }
    if(k==="accel"){ av=(a.metrics||{}).accel; bv=(b.metrics||{}).accel; }
    if(k==="hn"){ av=((a.hn||{}).points||0); bv=((b.hn||{}).points||0); }
    av = av==null?-1:av; bv = bv==null?-1:bv;
    if(typeof av==="string") return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });
  return rows;
}

/* ---------- nav ---------- */
const VIEWS = [
  ["overview","概览"],["velocity","涨得最快"],["new","新项目"],
  ["domains","分类分布"],["all","全部项目"]
];
const NAV_ICONS = {
  overview:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="13" y="3" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><rect x="13" y="13" width="6" height="6" rx="1"/>',
  velocity:'<path d="m3 16 5-5 4 3 7-10M13 4h6v6"/>',
  new:'<path d="m11 2 2.5 6.5L20 11l-6.5 2.5L11 20l-2.5-6.5L2 11l6.5-2.5Z"/>',
  domains:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="13" y="3" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><path d="M13 16h6m-3-3v6"/>',
  all:'<path d="M8 5h11M8 11h11M8 17h11M3 5h.1M3 11h.1M3 17h.1"/>'
};
function renderNav(){
  document.getElementById("nav").innerHTML = VIEWS.map(([k,label])=>{
    let n = REPOS.length;
    if(k==="new") n = REPOS.filter(r=>r.age_days!=null && r.age_days<=90).length;
    return `<button data-v="${k}" class="${state.view===k?"on":""}" aria-current="${state.view===k?'page':'false'}">
      <svg class="nav-icon" viewBox="0 0 22 22" aria-hidden="true">${NAV_ICONS[k]}</svg>
      <span>${label}</span><span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#nav button").forEach(b=>{
    b.onclick = ()=>{ state.view=b.dataset.v; render(); window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"}); };
  });
}

function renderChips(){
  const counts = {};
  REPOS.forEach(r=>counts[r.domain]=(counts[r.domain]||0)+1);
  const all = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const items = ["全部", ...all];
  document.getElementById("domainChips").innerHTML = items.map(d=>
    `<button class="chip ${state.domain===d?"on":""}" data-d="${esc(d)}" aria-pressed="${state.domain===d}"><span class="chip-label"><i class="chip-dot" style="background:${d==="全部"?'var(--mint)':dc(d)}" aria-hidden="true"></i>${esc(dl(d))}</span><span class="chip-count">${d==="全部"?REPOS.length:counts[d]}</span></button>`
  ).join("");
  document.querySelectorAll("#domainChips .chip").forEach(b=>{
    b.onclick = ()=>{ state.domain=b.dataset.d; render(); };
  });

  const langs = {...{}};
  REPOS.forEach(r=>{ if(r.language) langs[r.language]=(langs[r.language]||0)+1; });
  const sorted = Object.keys(langs).sort((a,b)=>langs[b]-langs[a]);
  const sel = document.getElementById("langSel");
  sel.innerHTML = `<option value="全部">全部语言</option>` +
    sorted.map(l=>`<option value="${esc(l)}">${esc(l)} · ${langs[l]}</option>`).join("");
  sel.value = state.lang;
}

/* ---------- table ---------- */
const COLS_ALL = [
  ["repo","项目"],["rate_day","日增星"],["accel","加速"],["stars","总星数"],
  ["momentum","热度"],["hn","讨论"],["spark","走势"]
];
const COLS_BASE = [
  ["repo","项目"],["rate_day","日增星"],["accel","加速"],["stars","总星数"],["momentum","热度"]
];

function renderTable(rows, opts={}){
  const cols = opts.cols || COLS_ALL;
  const head = cols.map(([k,label])=>{
    const on = state.sort===k;
    return `<span data-s="${k}" role="button" tabindex="0" aria-label="按${esc(label)}排序" class="${on?"ar":""}">${label}${on?(state.dir<0?" ↓":" ↑"):""}</span>`;
  }).join("");
  const html = rows.map((r,i)=>{
    const m = r.metrics||{};
    const hn = r.hn||{};
    const [own,name] = (r.repo||"").split("/");
    const cells = {
      repo:`<div class="main"><div class="repo">
              <i class="dot" style="background:${dc(r.domain)}"></i>
              <span class="own">${esc(own)}/</span><span class="rn">${esc(name)}</span>
              ${hn.points?`<i class="hn-dot" title="国外社区在讨论"></i>`:""}
            </div>
            <div class="desc">${esc(r.desc||"—")}</div></div>`,
      rate_day:`<div data-label="日增星" class="num up" title="${m.rate_basis==="daily"?"GitHub 官方标注的今天新增":m.rate_basis==="weekly"?"本周新增 ÷ 7":m.rate_basis==="monthly"?"本月新增 ÷ 30":m.rate_basis==="snapshot"?"自己记录的历史差值":"按项目生命周期平均估算"}">${m.estimated?"~":"+"}${fmt(Math.round(m.rate_day||0))}</div>`,
      accel:`<div data-label="加速" class="num ${m.accel==null?"dim":(m.accel>=1.6?"warn":"dim")}">${m.accel==null?"—":m.accel.toFixed(1)+"×"}</div>`,
      stars:`<div data-label="总星数" class="num dim">${fmt(r.stars)}</div>`,
      momentum:`<div data-label="热度" class="mom-cell"><span class="v">${(r.momentum||0).toFixed(0)}</span>
                <span class="track"><i style="width:${Math.min(100,r.momentum||0)}%"></i></span></div>`,
      hn:`<div data-label="讨论" class="num dim">${hn.points?fmt(hn.points):"—"}</div>`,
      spark:`<div class="sparkcell">${spark(r.history)}</div>`
    };
    return `<div class="row" tabindex="0" data-i="${REPOS.indexOf(r)}">
      <div class="rk">${i+1}</div>${cols.map(([k])=>cells[k]).join("")}</div>`;
  }).join("");
  const sortControl=["overview","all"].includes(state.view)?`<div class="mobile-sort"><label for="sort-${state.view}">排序</label><select id="sort-${state.view}" data-mobile-sort>${cols.filter(([k])=>k!=="spark").map(([k,label])=>`<option value="${k}" ${state.sort===k?"selected":""}>${esc(label)}</option>`).join("")}</select><button type="button" data-sort-direction aria-label="切换排序方向">${state.dir<0?"从高到低 ↓":"从低到高 ↑"}</button></div>`:"";
  return `${sortControl}<div class="cols"><span></span>${head}</div><div class="rows">${html || '<div class="empty">没有匹配的项目，试试其他关键词或重置筛选。</div>'}</div>`;
}

function bindTable(root){
  root.querySelectorAll("[data-mobile-sort]").forEach(s=>{s.onchange=()=>{state.sort=s.value;render();document.querySelector(`#view-${state.view} [data-mobile-sort]`)?.focus({preventScroll:true});};});
  root.querySelectorAll("[data-sort-direction]").forEach(b=>{b.onclick=()=>{state.dir*=-1;render();document.querySelector(`#view-${state.view} [data-sort-direction]`)?.focus({preventScroll:true});};});
  root.querySelectorAll(".cols span[data-s]").forEach(s=>{
    s.onkeydown = e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();s.click();}};
    s.onclick = ()=>{
      const k=s.dataset.s;
      if(state.sort===k) state.dir*=-1; else { state.sort=k; state.dir=-1; }
      render();
      document.querySelector(`#view-${state.view} .cols [data-s="${k}"]`)?.focus({preventScroll:true});
    };
  });
  root.querySelectorAll(".row").forEach(row=>{
    const open = ()=>openDrawer(REPOS[+row.dataset.i]);
    row.onclick = open;
    row.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  });
}

/* ---------- views ---------- */
function renderSummary(rows){
  const measured=rows.filter(r=>["daily","snapshot"].includes((r.metrics||{}).rate_basis)).length;
  const estimated=rows.filter(r=>(r.metrics||{}).estimated).length;
  const unknown=rows.length-measured-estimated;
  const young=rows.filter(r=>r.age_days!=null && r.age_days<=90);
  const buckets=[young.filter(r=>r.age_days<=7).length,young.filter(r=>r.age_days>7 && r.age_days<=30).length,young.filter(r=>r.age_days>30).length];
  const maxBucket=Math.max(...buckets,1);
  const discussion=rows.filter(r=>(r.hn||{}).points>0);
  const hnTop=[...discussion].sort((a,b)=>b.hn.points-a.hn.points).slice(0,3);
  const maxPoints=hnTop.length?hnTop[0].hn.points:1;
  const domains=new Set(rows.map(r=>r.domain)).size;
  return `<div class="summary-grid">
    <article class="summary-card">
      <div class="summary-label">监控项目<small>${domains} 个领域</small></div>
      <div class="summary-value">${rows.length}<small>当前筛选</small></div>
      <p class="summary-caption">日增数据覆盖，区分实测与估算</p>
      <div class="summary-coverage" aria-hidden="true"><i style="width:${measured/Math.max(rows.length,1)*100}%"></i><i class="estimate" style="width:${estimated/Math.max(rows.length,1)*100}%"></i></div>
      <div class="summary-legend"><span><i></i>实测 ${measured}</span><span class="estimate"><i></i>估算 ${estimated}</span>${unknown?`<span>待补充 ${unknown}</span>`:""}</div>
    </article>
    <article class="summary-card">
      <div class="summary-label">新项目<small>创建不满 90 天</small></div>
      <div class="summary-value">${young.length}<small>${Math.round(young.length/Math.max(rows.length,1)*100)}% 占比</small></div>
      <div class="age-chart" role="img" aria-label="新项目年龄分布：7天内 ${buckets[0]} 个，8至30天 ${buckets[1]} 个，31至90天 ${buckets[2]} 个">${buckets.map((c,i)=>`<div class="age-column"><b>${c}</b><i style="height:${c/maxBucket*48}px"></i><span>${["7 天内","8–30 天","31–90 天"][i]}</span></div>`).join("")}</div>
    </article>
    <article class="summary-card">
      <div class="summary-label">有社区讨论的项目<small>Hacker News</small></div>
      <div class="summary-value">${discussion.length}</div>
      <p class="summary-caption">仅统计已采样项目，条形表示讨论点数</p>
      <div class="hn-bars">${hnTop.map(r=>`<div class="hn-bar" title="${esc(r.repo)}：${r.hn.points} 点"><span>${esc(r.repo.split("/")[1])}</span><span class="tr"><i style="width:${r.hn.points/maxPoints*100}%"></i></span><b>${fmt(r.hn.points)}</b></div>`).join("") || '<p class="summary-caption">当前筛选下暂无讨论记录</p>'}</div>
    </article>
  </div>`;
}

function renderOverview(){
  const rows = filtered();
  const top = rows.slice(0,5);
  const domCount = {};
  rows.forEach(r=>domCount[r.domain]=(domCount[r.domain]||0)+1);
  const doms = Object.entries(domCount).sort((a,b)=>b[1]-a[1]).slice(0,9);
  const maxD = doms.length?doms[0][1]:1;

  const movers = top.map((r,i)=>{
    const m=r.metrics||{};
    return `<button class="mover" data-i="${REPOS.indexOf(r)}">
      <span class="rk"><span>排名 ${String(i+1).padStart(2,"0")}</span><em>${esc(dl(r.domain))}</em></span>
      <span class="mom">${(r.momentum||0).toFixed(0)}<i>/ 100 热度</i></span>
      <span class="nm">${esc(r.repo.split("/")[1])}</span><span class="owner">${esc(r.repo.split("/")[0])}</span>
      <span class="dt">${m.estimated?"~":"+"}${fmt(Math.round(m.rate_day||0))} 星 / 天</span>
      <span class="bar"><i style="width:${Math.min(100,r.momentum||0)}%"></i></span>
    </button>`;
  }).join("");

  const notes = buildNotes(rows);

  const totalGain = rows.reduce((s,r)=>s+((r.metrics||{}).rate_day||0),0);
  const measured = rows.filter(r=>["daily","snapshot"].includes((r.metrics||{}).rate_basis)).length;

  document.getElementById("view-overview").innerHTML = `
    <div class="hero">
      <div>
        <h1>开源趋势概览</h1>
        <p>追踪项目增长、发现新方向，看看今天的开源世界正在发生什么。</p>
      </div>
      <div class="stamp">
        <span class="stamp-label">日均新增 star 合计（含估算）</span>
        <b>≈${fmt(Math.round(totalGain))}<small>star / 天</small></b>
        <div class="coverage" aria-hidden="true"><i style="width:${rows.length?measured/rows.length*100:0}%"></i></div>
        <div class="coverage-label"><span>实测 ${measured} 个</span><span>估算 ${rows.length-measured} 个</span></div>
      </div>
    </div>
    ${renderSummary(rows)}
    <div class="section-heading"><h2>重点项目</h2><p>当前排序前 ${top.length} 位 · 点击查看详情</p></div>
    <div class="movers">${movers || '<div class="empty">没有匹配的项目</div>'}</div>
    <div class="split">
      <div class="pane">
        <h2>热门领域<span>项目数量</span></h2>
        <div class="segmented" aria-hidden="true">${doms.map(([d,c])=>`<i style="width:${c/Math.max(rows.length,1)*100}%;background:${dc(d)}"></i>`).join("")}</div>
        ${doms.map(([d,c])=>`
          <div class="domain-row">
            <span class="nm">${esc(dl(d))}</span>
            <span class="tr"><i style="width:${Math.round(c/maxD*100)}%;background:${dc(d)}"></i></span>
            <span class="ct">${c}</span>
          </div>`).join("") || '<div class="empty">暂无数据</div>'}
      </div>
      <div class="pane">
        <h2>今天值得关注<span>从数据中发现信号</span></h2>
        <div class="notes">${notes}</div>
      </div>
    </div>
    <div class="tbl-head">
      <h2>热度前 15</h2>
      <p>带 ~ 的是估算值，带 + 的是真实日增</p>
    </div>
    ${renderTable(rows.slice(0,15), {cols:COLS_ALL})}
  `;
  document.querySelectorAll("#view-overview .mover").forEach(el=>{
    el.onclick = ()=>openDrawer(REPOS[+el.dataset.i]);
  });
  bindTable(document.getElementById("view-overview"));
}

function buildNotes(rows){
  const out = [];
  const hottest = [...rows].sort((a,b)=>((b.metrics||{}).rate_day||0)-((a.metrics||{}).rate_day||0))[0];
  if(hottest){
    const hm=hottest.metrics||{};
    const txt = hm.estimated
      ? `约 ${fmt(Math.round(hm.rate_day||0))} star / 天（由周榜或历史估算）`
      : `今天新增 ${fmt(Math.round(hm.rate_day||0))} star`;
    out.push(`<div class="note hot"><i class="k"></i><div>
      <b>今天涨得最猛：${esc(hottest.repo)}</b>
      <span>${txt}，目前共 ${fmt(hottest.stars)} 个 star。</span></div></div>`);
  }

  const accel = [...rows].filter(r=>(r.metrics||{}).accel>0)
    .sort((a,b)=>(b.metrics.accel)-(a.metrics.accel))[0];
  if(accel && accel.metrics.accel>=1.5) out.push(`<div class="note mint"><i class="k"></i><div>
    <b>正在加速：${esc(accel.repo)}</b>
    <span>今天比最近一周平均快 ${accel.metrics.accel.toFixed(1)} 倍，热度刚刚被点燃，还在升温。</span></div></div>`);

  const young = [...rows].filter(r=>r.age_days!=null && r.age_days<=90 && r.stars>500)
    .sort((a,b)=>(b.stars_per_day_life||0)-(a.stars_per_day_life||0))[0];
  if(young) out.push(`<div class="note cool"><i class="k"></i><div>
    <b>刚冒出来的新项目：${esc(young.repo)}</b>
    <span>${ageText(young.age_days)}前创建，已经有 ${fmt(young.stars)} 个 star，平均每天 +${fmt(Math.round(young.stars_per_day_life||0))}。</span></div></div>`);

  const hnTop = [...rows].filter(r=>(r.hn||{}).points>0)
    .sort((a,b)=>(b.hn.points)-(a.hn.points))[0];
  if(hnTop) out.push(`<div class="note"><i class="k"></i><div>
    <b>有人在讨论：${esc(hnTop.repo)}</b>
    <span>国外社区 Hacker News 上有 ${hnTop.hn.mentions} 条讨论，共 ${hnTop.hn.points} 个赞、${hnTop.hn.comments} 条评论。</span></div></div>`);

  const domCount = {};
  rows.forEach(r=>domCount[r.domain]=(domCount[r.domain]||0)+1);
  const topDom = Object.entries(domCount).sort((a,b)=>b[1]-a[1])[0];
  if(topDom) out.push(`<div class="note"><i class="k"></i><div>
    <b>今天最热的分类：${esc(dl(topDom[0]))}</b>
    <span>这个分类下有 ${topDom[1]} 个项目，占了榜单的 ${Math.round(topDom[1]/Math.max(rows.length,1)*100)}%。</span></div></div>`);

  return out.join("") || '<div class="empty">当前筛选下没有数据</div>';
}

function renderVelocity(){
  const rows = [...filtered()].sort((a,b)=>(b.metrics.rate_day||0)-(a.metrics.rate_day||0));
  document.getElementById("view-velocity").innerHTML = `
    <div class="tbl-head"><h2>涨得最快</h2>
      <p>按每天新增 star 排序 · ${rows.length} 个项目</p></div>
    ${renderTable(rows, {cols:COLS_ALL})}`;
  bindTable(document.getElementById("view-velocity"));
}

function renderNew(){
  const rows = filtered().filter(r=>r.age_days!=null && r.age_days<=90)
    .sort((a,b)=>(b.stars_per_day_life||0)-(a.stars_per_day_life||0));
  const body = rows.length ? `<div class="cols cols-new">
      <span></span><span>项目</span><span>出生</span><span>总星数</span>
      <span>平均每天</span><span>热度</span>
    </div><div class="rows">${rows.map((r,i)=>{
      const [own,name]=(r.repo||"").split("/");
      return `<div class="row row-new" tabindex="0" data-i="${REPOS.indexOf(r)}">
        <div class="rk">${i+1}</div>
        <div class="main"><div class="repo"><i class="dot" style="background:${dc(r.domain)}"></i>
          <span class="own">${esc(own)}/</span><span class="rn">${esc(name)}</span></div>
          <div class="desc">${esc(r.desc||"—")}</div></div>
        <div class="num dim" data-label="出生">${ageText(r.age_days)}</div>
        <div class="num dim" data-label="总星数">${fmt(r.stars)}</div>
        <div class="num up" data-label="平均每天">+${fmt(Math.round(r.stars_per_day_life||0))}</div>
        <div class="mom-cell" data-label="热度"><span class="v">${(r.momentum||0).toFixed(0)}</span>
          <span class="track"><i style="width:${Math.min(100,r.momentum||0)}%"></i></span></div>
      </div>`;}).join("")}</div>`
    : `<div class="empty">90 天内没有符合条件的新项目，试试放宽筛选。</div>`;

  document.getElementById("view-new").innerHTML = `
    <div class="tbl-head"><h2>刚冒出来的新项目</h2>
      <p>出生不到 90 天 · 按平均每天新增 star 排序 · ${rows.length} 个</p></div>${body}`;
  document.querySelectorAll("#view-new .row").forEach(row=>{
    const open=()=>openDrawer(REPOS[+row.dataset.i]);
    row.onclick=open;
    row.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  });
}

function renderDomains(){
  const rows = filtered();
  const groups = {};
  rows.forEach(r=>{(groups[r.domain]=groups[r.domain]||[]).push(r);});
  const cards = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([d,list])=>{
    const top = [...list].sort((a,b)=>(b.momentum||0)-(a.momentum||0)).slice(0,5);
    const avg = list.reduce((s,r)=>s+(r.momentum||0),0)/list.length;
    return `<div class="dcard">
      <h3><span style="border-left:3px solid ${dc(d)};padding-left:10px;color:var(--text)">${esc(dl(d))}</span><em>${list.length} 个 · 平均热度 ${avg.toFixed(0)}</em></h3>
      <ol>${top.map(r=>`<li data-i="${REPOS.indexOf(r)}">
        <span>${esc(r.repo)}</span><b>${(r.momentum||0).toFixed(0)}</b></li>`).join("")}</ol>
    </div>`;
  }).join("");

  document.getElementById("view-domains").innerHTML = `
    <div class="tbl-head"><h2>分类分布</h2>
      <p>看看今天的热点集中在哪些方向</p></div>
    ${cards?`<div class="dgrid">${cards}</div>`:'<div class="empty">暂无数据</div>'}`;
  document.querySelectorAll("#view-domains .dcard li").forEach(li=>{
    li.onclick=()=>openDrawer(REPOS[+li.dataset.i]);
  });
}

function renderAll(){
  const rows = filtered();
  document.getElementById("view-all").innerHTML = `
    <div class="tbl-head"><h2>全部项目</h2>
      <p>${rows.length} / ${REPOS.length} 个 · 可按指标排序</p></div>
    ${renderTable(rows, {cols:COLS_ALL})}`;
  bindTable(document.getElementById("view-all"));
}

/* ---------- drawer ---------- */
let drawerTrigger = null;
function openDrawer(r){
  if(!r) return;
  drawerTrigger = document.activeElement;
  const m=r.metrics||{}, hn=r.hn||{};
  const [own,name]=(r.repo||"").split("/");
  const hist = (r.history||[]).slice(-14);
  const histRows = hist.map(([d,v],i)=>{
    const prev = i>0?hist[i-1][1]:null;
    const delta = prev!=null? v-prev : null;
    return `<tr><td>${d}</td><td>${fmt(v)}${delta!=null?` <span style="color:${delta>=0?"var(--positive)":"#cc4f59"}">${delta>=0?"+":""}${delta}</span>`:""}</td></tr>`;
  }).reverse().join("");

  document.getElementById("drawer").innerHTML = `
    <button class="x" id="drawerX" aria-label="关闭">✕</button>
    <div class="tag" style="border-left:3px solid ${dc(r.domain)};padding-left:10px;color:var(--dim)">${esc(dl(r.domain))}${r.language?" · "+esc(r.language):""}</div>
    <h2 id="drawerTitle">${esc(r.repo)}</h2>
    <div class="sub">${r.created_at?"创建于 "+r.created_at+"（"+ageText(r.age_days)+"）":"不知道什么时候创建的"}</div>
    <div class="body">${esc(r.desc||"这个项目还没有自我介绍。")}</div>

    <div class="dstats">
      <div class="dstat"><span class="k">热度</span><span class="v">${(r.momentum||0).toFixed(0)}<small>/100</small></span></div>
      <div class="dstat"><span class="k">每天新增 star</span><span class="v">${m.estimated?"~":"+"}${fmt(Math.round(m.rate_day||0))}</span></div>
      <div class="dstat"><span class="k">加速</span><span class="v">${m.accel==null?'<small class="na">还没有数据</small>':m.accel.toFixed(1)+'<small>×</small>'}</span></div>
      <div class="dstat"><span class="k">总 star</span><span class="v">${fmt(r.stars)}</span></div>
      <div class="dstat"><span class="k">Fork</span><span class="v">${fmt(r.forks)}</span></div>
      <div class="dstat"><span class="k">近一周平均</span><span class="v">${m.rate_week==null?"—":"+"+fmt(Math.round(m.rate_week))}</span></div>
    </div>

    ${histRows?`<div class="dsec"><h4>star 历史</h4>
      <table class="tbl-mini">${histRows}</table></div>`:
      `<div class="dsec"><h4>star 历史</h4>
       <div style="color:var(--faint);font-size:.875rem">刚开始记录，明天起这里会出现增长曲线。</div></div>`}

    ${hn.points?`<div class="dsec"><h4>国外社区讨论（Hacker News）</h4>
      <a class="hncard" href="${esc(safeUrl(hn.top&&hn.top.url))}" target="_blank" rel="noopener">
        <b>${esc(hn.top?hn.top.title:"相关讨论")}</b>
        <span>${hn.mentions} 条讨论 · ${hn.points} 个赞 · ${hn.comments} 条评论</span></a></div>`:""}

    <div class="dsec"><h4>为什么上榜</h4>
      <table class="tbl-mini">
        ${r.gain&&r.gain.daily?`<tr><td>今天新增</td><td>+${fmt(r.gain.daily)}</td></tr>`:""}
        ${r.gain&&r.gain.weekly?`<tr><td>本周新增</td><td>+${fmt(r.gain.weekly)}</td></tr>`:""}
        ${r.gain&&r.gain.monthly?`<tr><td>本月新增</td><td>+${fmt(r.gain.monthly)}</td></tr>`:""}
        ${r.stars_per_day_life?`<tr><td>平均每天（从创建到现在）</td><td>+${fmt(Math.round(r.stars_per_day_life))}</td></tr>`:""}
        <tr><td>上了哪些榜</td><td>${(r.windows||[]).map(w=>({daily:"日榜",weekly:"周榜",monthly:"月榜"}[w]||w)).join(" / ")||"搜索发现"}</td></tr>
      </table>
    </div>

    <div class="links">
      <a href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">打开项目</a>
      ${r.homepage?`<a href="${esc(safeUrl(r.homepage))}" target="_blank" rel="noopener">项目官网</a>`:""}
      <a href="https://star-history.com/#${esc(r.repo)}&Date" target="_blank" rel="noopener">star 增长曲线</a>
      <a href="https://github.com/search?q=${encodeURIComponent(r.repo)}&type=issues" target="_blank" rel="noopener">相关讨论</a>
    </div>
  `;
  document.getElementById("drawerX").onclick = closeDrawer;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
  document.getElementById("drawer").inert = false;
  document.querySelector(".app").inert = true;
  document.body.classList.add("drawer-open");
  document.getElementById("drawer").scrollTop = 0;
  document.getElementById("drawerX").focus();
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("on");
  document.getElementById("drawer").inert = true;
  document.querySelector(".app").inert = false;
  document.body.classList.remove("drawer-open");
  if(drawerTrigger && drawerTrigger.isConnected) drawerTrigger.focus({preventScroll:true});
}
document.getElementById("scrim").onclick = closeDrawer;

/* ---------- render ---------- */
function render(){
  renderNav(); renderChips();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("view-"+state.view).classList.add("on");
  ({overview:renderOverview, velocity:renderVelocity, new:renderNew,
    domains:renderDomains, all:renderAll})[state.view]();
}

/* ---------- live refresh ---------- */
const REFRESH_SECONDS = 60;
let _liveTimer = null;

function renderDateline(){
  const d = DATA.date || new Date().toISOString().slice(0,10);
  const tm = (DATA.generated_at||"").split(" ")[1] || "";
  document.getElementById("dateline").innerHTML =
    `<span>${d}</span><b>${DATA.count||0} 个项目</b><span>${tm?"更新于 "+esc(tm):""}</span>`;
}

function setLive(mode, text){
  const el = document.getElementById("live");
  if(!el) return;
  if(mode === "off"){
    el.className = "live off";
    el.innerHTML = "<i></i>离线模式";
    el.title = "用 file:// 打开时无法自动刷新，跑 python3 serve.py 即可在线刷新";
  } else {
    el.className = "live";
    el.innerHTML = "<i></i>" + (text || "自动刷新中");
    el.title = "点击立即刷新";
  }
}

function applyData(obj){
  if(!obj || !Array.isArray(obj.repos)) return false;
  DATA = obj;
  REPOS = obj.repos;
  render();
  renderDateline();
  return true;
}

async function checkRefresh(){
  try{
    const res = await fetch("data/latest.json?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("http " + res.status);
    const obj = await res.json();
    if(obj && Array.isArray(obj.repos)){
      if(obj.generated_at !== DATA.generated_at){
        if(applyData(obj)){
          setLive("ok", "已更新 " + (obj.generated_at||"").split(" ")[1]);
          return "updated";
        }
      } else {
        setLive("ok");
        return "same";
      }
    }
    return "same";
  }catch(e){
    // file:// 下 fetch 会被浏览器拦截，退回内嵌数据，并停止无意义的轮询
    setLive("off");
    if(_liveTimer){ clearInterval(_liveTimer); _liveTimer = null; }
    return "offline";
  }
}

function manualRefresh(){
  const el = document.getElementById("live");
  if(!el || el.dataset.busy) return;
  el.dataset.busy = "1";
  setLive("ok", "刷新中…");
  checkRefresh().then(r=>{
    delete el.dataset.busy;
    if(r === "same") setLive("ok", "已是最新");
  });
}

/* ---------- init ---------- */
(function init(){
  renderDateline();
  setLive(location.protocol === "file:" ? "off" : "ok");
  document.getElementById("foot").innerHTML =
    `<b><i class="source-dot" aria-hidden="true"></i>多源趋势观察</b><br>GitHub 热门榜与搜索<br>Hacker News 社区讨论<br><br>+ 实测日增　~ 估算日增`;

  const q = document.getElementById("q");
  let t;
  q.oninput = ()=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=q.value.trim(); render(); },140); };

  document.getElementById("resetFilters").onclick = ()=>{
    state.domain="全部";state.lang="全部";state.minMom=0;state.q="";
    q.value="";document.getElementById("momSel").value="0";render();
  };

  document.getElementById("langSel").onchange = e=>{ state.lang=e.target.value; render(); };
  document.getElementById("momSel").onchange = e=>{ state.minMom=+e.target.value; render(); };

  document.addEventListener("keydown", e=>{
    const drawer = document.getElementById("drawer");
    if(drawer.classList.contains("on") && e.key==="Tab"){
      const focusable = [...drawer.querySelectorAll('button,a[href],[tabindex="0"]')];
      const first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
    }
    if(e.key==="/" && !drawer.classList.contains("on") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
    if(e.key==="Escape"){ if(document.getElementById("drawer").classList.contains("on")) closeDrawer();
      else if(document.activeElement===q){ q.blur(); q.value=""; state.q=""; render(); } }
  });

  document.getElementById("live").onclick = manualRefresh;
  if(location.protocol !== "file:") _liveTimer = setInterval(checkRefresh, REFRESH_SECONDS * 1000);
  render();
})();
</script>
