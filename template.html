<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitTrend</title>
<style>
:root{
  --ink:#121615; --panel:#191f1d; --panel2:#1f2624; --rule:#2b3431;
  --text:#e6ebe7; --dim:#97a29b; --faint:#79857e;
  --mint:#6fd3a6; --copper:#e07a4a; --blue:#7ea6d8;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC",serif;
  --rail:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;
  -webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(111,211,166,.25)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{border-right:1px solid var(--rule);padding:26px 20px 20px;
  display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:22px;line-height:1.15;letter-spacing:-.01em}
.brand b{display:block;font-weight:600}
.brand span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.14em;
  display:block;margin-top:8px;text-transform:uppercase}

nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:5px;color:var(--dim);text-align:left;font-size:13.5px}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text)}
nav button .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
nav button.on .n{color:var(--mint)}

.filters{display:flex;flex-direction:column;gap:20px;overflow-y:auto;flex:1;min-height:0;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent)}
.fgroup>h3{font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin-bottom:9px;
  font-weight:500;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 8px;border:1px solid var(--rule);border-radius:99px;font-size:11.5px;
  color:var(--dim);transition:.15s}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip.on{background:var(--mint);border-color:var(--mint);color:#0e1512;font-weight:600}
select{width:100%;background:var(--panel);border:1px solid var(--rule);color:var(--text);
  padding:7px 9px;border-radius:5px;font-size:12.5px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
                   linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.rail footer{font-size:10.5px;color:var(--faint);font-family:var(--mono);line-height:1.7;
  border-top:1px solid var(--rule);padding-top:14px}
.rail footer b{color:var(--dim);font-weight:400}

/* ---------- main ---------- */
main{min-width:0;padding:0 40px 80px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(18,22,21,.93);
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:20px;
  padding:20px 0 16px;border-bottom:1px solid var(--rule)}
.dateline{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em;
  display:flex;gap:14px;white-space:nowrap}
.dateline b{color:var(--dim);font-weight:400}
.search{margin-left:auto;position:relative;width:300px;max-width:46vw}
.search input{width:100%;background:var(--panel);border:1px solid var(--rule);
  border-radius:5px;padding:8px 12px 8px 32px;color:var(--text);font-size:13px;outline:none}
.search input:focus{border-color:var(--mint)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:9px;stroke:var(--faint)}
.search kbd{position:absolute;right:8px;top:7px;font-family:var(--mono);font-size:10px;
  color:var(--faint);border:1px solid var(--rule);border-radius:3px;padding:1px 5px}

.view{display:none;animation:rise .3s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* ---------- hero ---------- */
.hero{padding:52px 0 38px;display:grid;grid-template-columns:1fr auto;
  align-items:end;gap:32px;border-bottom:1px solid var(--rule)}
.hero h1{font-family:var(--serif);font-size:clamp(34px,4.6vw,54px);font-weight:400;
  line-height:1.02;letter-spacing:-.015em}
.hero p{color:var(--dim);max-width:44ch;font-size:13.5px;margin-top:14px;line-height:1.65}
.hero .stamp{text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);
  line-height:1.9;white-space:nowrap}
.hero .stamp b{font-family:var(--serif);font-size:30px;color:var(--text);
  display:block;font-weight:400;line-height:1;margin-bottom:6px}

/* ---------- movers ---------- */
.movers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.mover{padding:26px 20px 24px;border-right:1px solid var(--rule);position:relative;
  text-align:left;transition:background .15s;display:block;min-width:0;overflow:hidden}
.mover:last-child{border-right:none}
.mover:hover{background:var(--panel)}
.mover .rk{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;
  margin-bottom:18px}
.mover .mom{font-family:var(--serif);font-size:40px;line-height:.9;letter-spacing:-.02em}
.mover .mom i{font-style:normal;font-size:14px;color:var(--faint);margin-left:2px}
.mover .nm{display:block;margin-top:12px;font-size:12.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mover .dt{display:block;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bar{position:absolute;left:20px;right:20px;bottom:0;height:2px;background:var(--rule)}
.bar i{display:block;height:100%;background:var(--mint);transform-origin:left;
  animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}

/* ---------- panels ---------- */
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border-bottom:1px solid var(--rule)}
.pane{padding:32px 0}
.pane+.pane{border-left:1px solid var(--rule);padding-left:32px}
.pane:first-child{padding-right:32px}
.pane h2{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:20px;letter-spacing:.02em}

.domain-row{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;align-items:center;
  gap:12px;padding:5px 0;font-size:12.5px}
.domain-row .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.domain-row .tr{height:5px;background:var(--panel2);border-radius:2px;overflow:hidden}
.domain-row .tr i{display:block;height:100%;border-radius:2px}
.domain-row .ct{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}

.notes{display:flex;flex-direction:column;gap:16px}
.note{display:grid;grid-template-columns:3px 1fr;gap:14px;font-size:12.5px;line-height:1.6}
.note .k{background:var(--rule);border-radius:2px}
.note.hot .k{background:var(--copper)}
.note.cool .k{background:var(--blue)}
.note.mint .k{background:var(--mint)}
.note b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}
.note span{color:var(--dim)}

/* ---------- table ---------- */
.tbl-head{display:flex;align-items:baseline;justify-content:space-between;
  padding:34px 0 16px;border-bottom:1px solid var(--rule)}
.tbl-head h2{font-family:var(--serif);font-size:24px;font-weight:400}
.tbl-head p{font-size:12px;color:var(--faint);font-family:var(--mono)}
.cols, .row{display:grid;
  grid-template-columns:38px minmax(240px,1fr) 92px 84px 78px 88px 64px 110px;
  gap:14px;align-items:center}
.row.row-new{grid-template-columns:38px minmax(240px,1fr) 84px 84px 108px 110px}
.cols{padding:10px 8px 10px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);
  font-size:10px;color:var(--faint);letter-spacing:.06em}
.cols span{cursor:pointer;user-select:none;white-space:nowrap}
.cols span:nth-child(3),.cols span:nth-child(4),.cols span:nth-child(5),
.cols span:nth-child(6),.cols span:nth-child(7){text-align:right}
.cols span:hover{color:var(--dim)}
.cols .ar{color:var(--mint)}
.rows{display:flex;flex-direction:column}
.row{padding:13px 8px 13px 0;border-bottom:1px solid rgba(43,52,49,.55);cursor:pointer;
  transition:background .12s;text-align:left;width:100%}
.row:hover{background:var(--panel)}
.row:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.row .rk{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.row .main{min-width:0}
.row .repo{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:0;min-width:0}
.row .repo .own{color:var(--faint);font-weight:400;flex:0 1 auto;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .repo .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.row .repo .dot{width:5px;height:5px;border-radius:50%;flex:none;margin-right:8px}
.row .desc{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:3px}
.num{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.num.big{font-size:13.5px;color:var(--text)}
.num.up{color:var(--mint)}
.num.dim{color:var(--dim)}
.num.warn{color:var(--copper)}
.mom-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mom-cell .v{font-family:var(--serif);font-size:17px;line-height:1}
.mom-cell .track{width:44px;height:3px;background:var(--panel2);border-radius:2px;flex:none}
.mom-cell .track i{display:block;height:100%;background:var(--mint);border-radius:2px}
.lang{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.spark{width:64px;height:18px;display:block}
.spark path{fill:none;stroke:var(--mint);stroke-width:1.4;stroke-linecap:round}
.spark path.flat{stroke:var(--rule)}

.empty{padding:60px 0;text-align:center;color:var(--faint);font-size:13px}
.hn-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--copper);
  margin-left:7px;vertical-align:middle;flex:none}

/* ---------- domain view ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:20px}
.dcard{background:var(--ink);padding:22px}
.dcard h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;
  align-items:center;margin-bottom:14px}
.dcard h3 em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--faint)}
.dcard ol{list-style:none;display:flex;flex-direction:column;gap:9px}
.dcard li{display:flex;justify-content:space-between;gap:10px;font-size:12px;cursor:pointer;
  padding:2px 0}
.dcard li:hover{color:var(--mint)}
.dcard li span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard li b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--faint);flex:none}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,10,.6);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--panel);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .28s
  cubic-bezier(.2,.8,.2,1);z-index:70;overflow-y:auto;padding:32px 34px 60px}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .x{position:absolute;top:22px;right:22px;color:var(--faint);font-size:18px;
  padding:4px 8px;border-radius:4px}
.drawer .x:hover{color:var(--text);background:var(--panel2)}
.drawer .tag{font-family:var(--mono);font-size:10.5px;color:var(--mint);letter-spacing:.08em}
.drawer h2{font-family:var(--serif);font-size:27px;font-weight:400;margin:10px 0 4px;
  line-height:1.2;word-break:break-word}
.drawer .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.drawer .body{color:var(--dim);font-size:13.5px;line-height:1.75;margin:20px 0 26px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin-bottom:26px}
.dstat{padding:16px 0;border-right:1px solid var(--rule)}
.dstat:nth-child(3n){border-right:none}
.dstat .k{font-size:10.5px;color:var(--faint);font-family:var(--mono);display:block;
  margin-bottom:5px}
.dstat .v{font-family:var(--serif);font-size:22px;line-height:1}
.dstat .v small{font-size:11px;font-family:var(--mono);color:var(--faint);margin-left:3px}
.dstat .v small.na{font-size:11.5px;font-family:var(--sans);color:var(--faint);margin:0}
.dsec h4{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:.07em;
  margin-bottom:10px}
.dsec{margin-bottom:24px}
.hncard{border:1px solid var(--rule);border-radius:6px;padding:13px 15px;font-size:12.5px;
  line-height:1.55;display:block}
.hncard:hover{border-color:var(--faint)}
.hncard b{display:block;font-weight:600;margin-bottom:5px;color:var(--text)}
.hncard span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid var(--rule);border-radius:5px;padding:7px 13px;font-size:12px;
  color:var(--dim)}
.links a:hover{border-color:var(--mint);color:var(--mint)}
.tbl-mini{width:100%;font-size:12px;border-collapse:collapse}
.tbl-mini td{padding:6px 0;border-bottom:1px solid rgba(43,52,49,.5)}
.tbl-mini td:last-child{text-align:right;font-family:var(--mono);font-size:11.5px;
  color:var(--dim)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .movers{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mover:nth-child(4),.mover:nth-child(5){display:none}
  .split{grid-template-columns:1fr}
  .pane+.pane{border-left:none;padding-left:0;border-top:1px solid var(--rule)}
  .cols:not(.cols-new),.row:not(.row-new){
    grid-template-columns:32px minmax(160px,1fr) 84px 74px 70px 80px}
  .cols:not(.cols-new) span:nth-child(7),.cols:not(.cols-new) span:nth-child(8),
  .row:not(.row-new) > *:nth-child(7),.row:not(.row-new) > *:nth-child(8){display:none}
  .cols.cols-new,.row.row-new{grid-template-columns:32px minmax(150px,1fr) 70px 70px 84px 80px}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);
    padding:16px 18px 12px;gap:14px;min-width:0}
  .brand{font-size:15px}
  .brand span{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav button{white-space:nowrap;padding:6px 10px;font-size:13px}
  nav button .n{display:none}
  .filters{flex-direction:row;gap:10px;overflow-x:auto;flex:none;padding-bottom:2px}
  .fgroup>h3{display:none}
  .fgroup{flex:none}
  .fgroup:nth-child(2),.fgroup:nth-child(3){display:none}
  .chips{flex-wrap:nowrap}
  .rail footer{display:none}
  main{padding:0 18px 60px}
  .hero{grid-template-columns:1fr;padding:26px 0 22px}
  .hero h1{font-size:32px}
  .hero .stamp{display:none}
  .movers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mover:nth-child(3){display:none}
  .mover{padding:16px 14px}
  .mover .mom{font-size:30px}
  .cols:not(.cols-new),.row:not(.row-new){
    grid-template-columns:22px minmax(100px,1fr) 58px 52px 54px;gap:9px}
  .cols:not(.cols-new) span:nth-child(4),.cols:not(.cols-new) span:nth-child(7),
  .cols:not(.cols-new) span:nth-child(8),
  .row:not(.row-new) > *:nth-child(4),
  .row:not(.row-new) > *:nth-child(7),
  .row:not(.row-new) > *:nth-child(8){display:none}
  .cols.cols-new,.row.row-new{grid-template-columns:22px minmax(100px,1fr) 52px 58px 54px;gap:9px}
  .cols.cols-new > *:nth-child(3),.row.row-new > *:nth-child(3){display:none}
  .num{font-size:11.5px}
  .mom-cell .track{display:none}
  .row .repo .own{display:none}
  .dateline span:last-child{display:none}
  .search{width:auto;flex:1;max-width:none;min-width:0}
  .search kbd{display:none}
  .topbar{gap:10px}
  .drawer{padding:28px 22px 50px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><b>GitTrend</b><span>GitHub 趋势雷达</span></div>
    <nav id="nav"></nav>
    <div class="filters">
      <div class="fgroup">
        <h3>领域</h3>
        <div class="chips" id="domainChips"></div>
      </div>
      <div class="fgroup">
        <h3>语言</h3>
        <select id="langSel"></select>
      </div>
      <div class="fgroup">
        <h3>最小动量</h3>
        <select id="momSel">
          <option value="0">不限</option>
          <option value="30">30 以上</option>
          <option value="45">45 以上</option>
          <option value="60">60 以上</option>
        </select>
      </div>
    </div>
    <footer id="foot"></footer>
  </aside>

  <main>
    <div class="topbar">
      <div class="dateline" id="dateline"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
        </svg>
        <input id="q" placeholder="搜项目、描述、语言…" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </div>

    <section class="view on" id="view-overview"></section>
    <section class="view" id="view-velocity"></section>
    <section class="view" id="view-new"></section>
    <section class="view" id="view-domains"></section>
    <section class="view" id="view-all"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
const DATA = /*__DATA__*/{};
const REPOS = DATA.repos || [];

const DOMAIN_COLORS = {
  "AI Agent":"#6fd3a6","LLM 应用":"#7ea6d8","模型 / 训练":"#b39ddb","AI 基建":"#8ecfc9",
  "开发工具":"#e0b464","数据 / 数据库":"#d99b6c","云原生 / 基础设施":"#9fb8d0",
  "前端 / Web":"#e8a3b8","移动 / 跨端":"#a8c98a","安全":"#e2857a","效率 / 个人工具":"#c3b1e1",
  "学习资源":"#b9b9a8","音视频 / 图形":"#d8a7c8","区块链 / Web3":"#c9a86a","其他":"#8b958f"
};
const dc = d => DOMAIN_COLORS[d] || "#8b958f";

const state = { view:"overview", domain:"全部", lang:"全部", minMom:0, q:"", sort:"momentum", dir:-1 };

/* ---------- helpers ---------- */
const fmt = n => n==null ? "—"
  : n>=1e9 ? (n/1e9).toFixed(1).replace(/\.0$/,"")+"b"
  : n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"")+"m"
  : n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"k"
  : String(Math.round(n));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function spark(points){
  if(!points || points.length<2) return '<svg class="spark"><path class="flat" d="M1 9 L63 9"/></svg>';
  const vals = points.map(p=>p[1]);
  const mn = Math.min(...vals), mx = Math.max(...vals), span = Math.max(mx-mn,1);
  const step = 62/(points.length-1);
  const d = vals.map((v,i)=>`${i?"L":"M"}${(1+i*step).toFixed(1)} ${(17-(v-mn)/span*15).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 64 18"><path d="${d}"/></svg>`;
}

function ageText(d){
  if(d==null) return "";
  if(d<1) return "今天";
  if(d<30) return d+" 天";
  if(d<365) return Math.round(d/30)+" 个月";
  return (d/365).toFixed(1)+" 年";
}

function filtered(){
  let rows = REPOS.filter(r=>{
    if(state.domain!=="全部" && r.domain!==state.domain) return false;
    if(state.lang!=="全部" && (r.language||"")!==state.lang) return false;
    if((r.momentum||0) < state.minMom) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      const hay=(r.repo+" "+(r.desc||"")+" "+(r.language||"")+" "+(r.domain||"")+" "+
        ((r.topics||[]).join(" "))).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const k = state.sort, dir = state.dir;
  rows.sort((a,b)=>{
    let av=a[k], bv=b[k];
    if(k==="rate_day"){ av=(a.metrics||{}).rate_day; bv=(b.metrics||{}).rate_day; }
    if(k==="accel"){ av=(a.metrics||{}).accel; bv=(b.metrics||{}).accel; }
    if(k==="hn"){ av=((a.hn||{}).points||0); bv=((b.hn||{}).points||0); }
    av = av==null?-1:av; bv = bv==null?-1:bv;
    if(typeof av==="string") return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });
  return rows;
}

const COLS_ALL = [
  ["repo","项目"],["rate_day","日增"],["accel","加速度"],["stars","总星"],
  ["momentum","动量"],["hn","讨论"],["spark","7 日走势"]

const COLS_BASE = [

function renderTable(rows, opts={}){
  const cols = opts.cols || COLS_ALL;
  const head = cols.map(([k,label])=>{
    const on = state.sort===k;
    return `<span data-s="${k}" class="${on?"ar":""}">${label}${on?(state.dir<0?" ↓":" ↑"):""}</span>`;
  }).join("");
  const html = rows.map((r,i)=>{
    const m = r.metrics||{};
    const hn = r.hn||{};
    const [own,name] = (r.repo||"").split("/");
    const cells = {
      repo:`<div class="main"><div class="repo">
              <i class="dot" style="background:${dc(r.domain)}"></i>
              <span class="own">${esc(own)}/</span><span class="rn">${esc(name)}</span>
              ${hn.points?`<i class="hn-dot" title="HN 讨论"></i>`:""}
            </div>
            <div class="desc">${esc(r.desc||"—")}</div></div>`,
      rate_day:`<div class="num up" title="${m.rate_basis==="daily"?"GitHub 日榜标注的今日新增":m.rate_basis==="weekly"?"周榜新增 ÷ 7":m.rate_basis==="monthly"?"月榜新增 ÷ 30":m.rate_basis==="snapshot"?"本地快照差值":"生命期均速推算"}">${m.estimated?"~":"+"}${fmt(Math.round(m.rate_day||0))}</div>`,
      accel:`<div class="num ${m.accel==null?"dim":(m.accel>=1.6?"warn":"dim")}">${m.accel==null?"—":m.accel.toFixed(1)+"×"}</div>`,
      stars:`<div class="num dim">${fmt(r.stars)}</div>`,
      momentum:`<div class="mom-cell"><span class="v">${(r.momentum||0).toFixed(0)}</span>
                <span class="track"><i style="width:${Math.min(100,r.momentum||0)}%"></i></span></div>`,
      hn:`<div class="num dim">${hn.points?fmt(hn.points):"—"}</div>`,
      spark:`<div class="sparkcell">${spark(r.history)}</div>`
    };
    return `<div class="row" tabindex="0" data-i="${REPOS.indexOf(r)}">
      <div class="rk">${i+1}</div>${cols.map(([k])=>cells[k]).join("")}</div>`;
  }).join("");
  return `<div class="cols"><span></span>${head}</div><div class="rows">${html}</div>`;
}

function bindTable(root){
  root.querySelectorAll(".cols span[data-s]").forEach(s=>{
    s.onclick = ()=>{
      const k=s.dataset.s;
      if(state.sort===k) state.dir*=-1; else { state.sort=k; state.dir=-1; }
      render();
    };
  });
  root.querySelectorAll(".row").forEach(row=>{
    const open = ()=>openDrawer(REPOS[+row.dataset.i]);
    row.onclick = open;
    row.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  });
}

function buildNotes(rows){
  const out = [];
  const hottest = [...rows].sort((a,b)=>((b.metrics||{}).rate_day||0)-((a.metrics||{}).rate_day||0))[0];
  if(hottest){
    const hm=hottest.metrics||{};
    const txt = hm.estimated
      ? `约 ${fmt(Math.round(hm.rate_day||0))} star / 天（由周榜或生命期推算）`
      : `今日 +${fmt(Math.round(hm.rate_day||0))} star`;
    out.push(`<div class="note hot"><i class="k"></i><div>
      <b>单日最猛：${esc(hottest.repo)}</b>
      <span>${txt}，总星 ${fmt(hottest.stars)}。</span></div></div>`);
  }

  const accel = [...rows].filter(r=>(r.metrics||{}).accel>0)
    .sort((a,b)=>(b.metrics.accel)-(a.metrics.accel))[0];
  if(accel && accel.metrics.accel>=1.5) out.push(`<div class="note mint"><i class="k"></i><div>
    <b>加速中：${esc(accel.repo)}</b>
    <span>当日速率是周均的 ${accel.metrics.accel.toFixed(1)} 倍，说明热度刚被点燃而不是惯性。</span></div></div>`);

  const young = [...rows].filter(r=>r.age_days!=null && r.age_days<=90 && r.stars>500)
    .sort((a,b)=>(b.stars_per_day_life||0)-(a.stars_per_day_life||0))[0];
  if(young) out.push(`<div class="note cool"><i class="k"></i><div>
    <b>新面孔：${esc(young.repo)}</b>
    <span>${ageText(young.age_days)}前创建，已 ${fmt(young.stars)} 星，生命期日均 +${fmt(Math.round(young.stars_per_day_life||0))}。</span></div></div>`);

  const hnTop = [...rows].filter(r=>(r.hn||{}).points>0)
    .sort((a,b)=>(b.hn.points)-(a.hn.points))[0];
  if(hnTop) out.push(`<div class="note"><i class="k"></i><div>
    <b>有人在聊：${esc(hnTop.repo)}</b>
    <span>HN 上 ${hnTop.hn.mentions} 条相关讨论，累计 ${hnTop.hn.points} 分、${hnTop.hn.comments} 条评论。</span></div></div>`);

  const domCount = {};
  rows.forEach(r=>domCount[r.domain]=(domCount[r.domain]||0)+1);
  const topDom = Object.entries(domCount).sort((a,b)=>b[1]-a[1])[0];
  if(topDom) out.push(`<div class="note"><i class="k"></i><div>
    <b>今日主线：${esc(topDom[0])}</b>
    <span>包揽 ${topDom[1]} 个项目，占了榜单的 ${Math.round(topDom[1]/Math.max(rows.length,1)*100)}%。</span></div></div>`);

  return out.join("") || '<div class="empty">当前筛选下没有数据</div>';
}

/* ---------- drawer ---------- */
function openDrawer(r){
  if(!r) return;
  const m=r.metrics||{}, hn=r.hn||{};
  const [own,name]=(r.repo||"").split("/");
  const hist = (r.history||[]).slice(-14);
  const histRows = hist.map(([d,v],i)=>{
    const prev = i>0?hist[i-1][1]:null;
    const delta = prev!=null? v-prev : null;
    return `<tr><td>${d}</td><td>${fmt(v)}${delta!=null?` <span style="color:${delta>=0?"#6fd3a6":"#e07a4a"}">${delta>=0?"+":""}${delta}</span>`:""}</td></tr>`;
  }).reverse().join("");

  document.getElementById("drawer").innerHTML = `
    <button class="x" id="drawerX" aria-label="关闭">✕</button>
    <div class="tag" style="color:${dc(r.domain)}">${esc(r.domain)}${r.language?" · "+esc(r.language):""}</div>
    <h2>${esc(r.repo)}</h2>
    <div class="sub">${r.created_at?"创建于 "+r.created_at+"（"+ageText(r.age_days)+"）":"创建时间未知"}</div>
    <div class="body">${esc(r.desc||"这个项目还没有写简介。")}</div>

    <div class="dstats">
      <div class="dstat"><span class="k">动量</span><span class="v">${(r.momentum||0).toFixed(0)}<small>/100</small></span></div>
      <div class="dstat"><span class="k">日均 star</span><span class="v">${m.estimated?"~":"+"}${fmt(Math.round(m.rate_day||0))}</span></div>
      <div class="dstat"><span class="k">加速度</span><span class="v">${m.accel==null?'<small class="na">暂无基线</small>':m.accel.toFixed(1)+'<small>×</small>'}</span></div>
      <div class="dstat"><span class="k">总星</span><span class="v">${fmt(r.stars)}</span></div>
      <div class="dstat"><span class="k">Fork</span><span class="v">${fmt(r.forks)}</span></div>
      <div class="dstat"><span class="k">周均速</span><span class="v">${m.rate_week==null?"—":"+"+fmt(Math.round(m.rate_week))}</span></div>
    </div>

    ${histRows?`<div class="dsec"><h4>STAR 历史</h4>
      <table class="tbl-mini">${histRows}</table></div>`:
      `<div class="dsec"><h4>STAR 历史</h4>
       <div style="color:#5d6a64;font-size:12px">首次采集，明天起会在这里积累曲线。</div></div>`}

    ${hn.points?`<div class="dsec"><h4>HACKER NEWS</h4>
      <a class="hncard" href="${esc(hn.top?hn.top.url:"#")}" target="_blank" rel="noopener">
        <b>${esc(hn.top?hn.top.title:"相关讨论")}</b>
        <span>${hn.mentions} 条提及 · 累计 ${hn.points} 分 · ${hn.comments} 评论</span></a></div>`:""}

    <div class="dsec"><h4>为什么在榜</h4>
      <table class="tbl-mini">
        ${r.gain&&r.gain.daily?`<tr><td>今日新增</td><td>+${fmt(r.gain.daily)}</td></tr>`:""}
        ${r.gain&&r.gain.weekly?`<tr><td>本周新增</td><td>+${fmt(r.gain.weekly)}</td></tr>`:""}
        ${r.gain&&r.gain.monthly?`<tr><td>本月新增</td><td>+${fmt(r.gain.monthly)}</td></tr>`:""}
        ${r.stars_per_day_life?`<tr><td>生命期日均</td><td>+${fmt(Math.round(r.stars_per_day_life))}</td></tr>`:""}
        <tr><td>出现在</td><td>${(r.windows||[]).map(w=>({daily:"日榜",weekly:"周榜",monthly:"月榜"}[w]||w)).join(" / ")||"搜索发现"}</td></tr>
      </table>

      <a href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">打开仓库</a>
      ${r.homepage?`<a href="${esc(r.homepage)}" target="_blank" rel="noopener">项目主页</a>`:""}
      <a href="https://star-history.com/#${esc(r.repo)}&Date" target="_blank" rel="noopener">Star 历史图</a>
      <a href="https://github.com/search?q=${encodeURIComponent(r.repo)}&type=issues" target="_blank" rel="noopener">相关讨论</a>
    </div>
  `;
  document.getElementById("drawerX").onclick = closeDrawer;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("on");
}

  ({overview:renderOverview, velocity:renderVelocity, new:renderNew,

    `<b>数据源</b><br>GitHub Trending<br>GitHub Search API<br>Hacker News<br><br>
     <b>更新</b> python3 radar.py`;

  const q = document.getElementById("q");
  let t;
  q.oninput = ()=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=q.value.trim(); render(); },140); };

  document.getElementById("langSel").onchange = e=>{ state.lang=e.target.value; render(); };

  document.addEventListener("keydown", e=>{
    if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); }
    if(e.key==="Escape"){ if(document.getElementById("drawer").classList.contains("on")) closeDrawer();
      else if(document.activeElement===q){ q.blur(); q.value=""; state.q=""; render(); } }
  });

  render();
})();
</script>
</body>
</html>
